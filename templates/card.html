<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>麦麦请客卡</title>
<!--
  卡片设计定稿（用户提供的 SVG 水彩稿）：
  底图为 templates/assets/card_bg.webp（由原 SVG 抠除动态文字后导出），
  版式/插画/标题全部烧在底图里，保证「除文字外一模一样」；
  本模板只负责把 4 块动态文字叠回原位（坐标按 1728x2304 -> 1080x1440 换算）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Zhi+Mang+Xing&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root{
    --han: "ZCOOL KuaiLe", "Microsoft YaHei", "PingFang SC", sans-serif;
    --pen: "Zhi Mang Xing", "STXingkai", "Xingkai SC", "KaiTi", "楷体", cursive;
    --latin: "Caveat", "Segoe Script", cursive;
    --brown-deep: #572514;
    --red: #CE2312;
    --maroon: #6B2A15;
  }

  html, body{ background:#F6DCD2; }

  .card {
    width: 1080px;
    height: 1440px;
    position: relative;
    overflow: hidden;
    color: var(--brown-deep);
    font-family: var(--han);
    background-color: #F6DCD2;
    background-image: url("$bg_uri");
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* —— 标题托板：标题从底图分离后下移，白色圆角底 —— */
  .title-plate {
    position: absolute;
    left: 50%; top: 220px;
    transform: translateX(-50%);
    background: #FFFDF8;
    border-radius: 30px;
    padding: 21px 46px 26px;
    box-shadow: 0 6px 18px rgba(87, 37, 20, .14);
  }
  .title-plate img {
    display: block;
    width: 809px;
    height: auto;
  }

  /* —— 动态文字层（坐标 = 原稿位置 x 0.625） —— */

  /* 红丝带文案：药丸 x354-733 y914-1006（已烧在底图里，只叠字） */
  .ribbon-text {
    position: absolute;
    left: 354px; top: 914px;
    width: 379px; height: 92px;
    line-height: 92px;
    text-align: center;
    white-space: nowrap;
    font-size: 31px;
    letter-spacing: 2px;
    color: #FFF6EA;
  }

  /* To: 收件人（原稿 x292-587 y1707-1763 -> x182-367 y1067-1102） */
  .to {
    position: absolute;
    left: 182px; top: 1056px;
    font-size: 46px;
    line-height: 1;
    color: var(--brown-deep);
    letter-spacing: 3px;
  }
  .to .to-en {
    font-family: var(--latin);
    font-weight: 700;
    font-size: 52px;
    margin-right: 10px;
  }

  /* 留言（原稿 x410-1352 y1803-1879 -> y1127-1174，水平居中） */
  .quote {
    position: absolute;
    left: 50%; top: 1122px;
    transform: translateX(-50%);
    width: 780px;
    font-family: var(--pen);
    font-size: 56px;
    line-height: 1.5;
    color: var(--red);
    letter-spacing: 2px;
    text-align: center;
  }

  /* 下单时间 / 预计送达（原稿留言与纸条之间的留白） */
  .meta {
    position: absolute;
    left: 0; top: 1198px;
    width: 100%;
    text-align: center;
    font-size: 21px;
    line-height: 1.35;
    color: #B58A6C;
    letter-spacing: 2px;
  }
  .meta .tail { margin-top: 3px; color: #C96A4A; }

  /* 已点餐食（原稿 x322-1448 y2024-2072 -> y1265-1295） */
  .strip {
    position: absolute;
    left: 0; top: 1258px;
    width: 100%;
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    color: var(--maroon);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .strip-label { font-family: var(--han); }
  .item { display: inline; }
  .item span + span { margin-left: 4px; }
  .item + .item::before {
    content: "丨";
    color: #C9A97E;
    margin: 0 10px;
  }

  /* 署名与参赛声明（底图留白处，非常淡） */
  .brand {
    position: absolute;
    right: 56px; bottom: 64px;
    font-family: var(--latin);
    font-weight: 700;
    font-size: 30px;
    color: rgba(87, 37, 20, .42);
    letter-spacing: 1px;
  }
  .disclaimer {
    position: absolute;
    left: 0; right: 0; bottom: 28px;
    text-align: center;
    font-size: 17px;
    color: rgba(87, 37, 20, .40);
    letter-spacing: 1px;
  }

  /* 预览角标（仅预览卡） */
  .badge {
    position: absolute;
    top: 44px; right: 48px;
    font-family: var(--han);
    font-size: 30px;
    color: #E23B2E;
    border: 4px double #E23B2E;
    border-radius: 12px;
    padding: 8px 20px;
    letter-spacing: 6px;
    text-indent: 6px;
    transform: rotate(8deg);
    background: rgba(255, 253, 248, .55);
    box-shadow: 0 0 0 2px rgba(226, 59, 46, .15);
  }
</style>
</head>
<body>
  <div class="card">
    $badge_html

    <div class="title-plate"><img src="$title_uri" alt="麦麦请客卡"></div>

    <div class="ribbon-text">$subtitle</div>

    <div class="to"><span class="to-en">To:</span>$recipient</div>
    <div class="quote">“$message”</div>

    <div class="meta">
      <div>$timestamp</div>
      $eta_html
    </div>

    <div class="strip"><span class="strip-label">已点餐食：</span>$items_html</div>

    <div class="brand">$brand</div>
    <div class="disclaimer">本卡片为独立参赛作品，非麦当劳官方产品</div>
  </div>
</body>
</html>
